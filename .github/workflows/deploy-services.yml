name: Deploy All Services to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-all:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy All Services to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/services' }}
        run: |
          echo "Deploying all services to VPS..."

          # Find all docker-compose files
          COMPOSE_FILES=$(find . -type f -name "docker-compose*.yml" -o -name "docker-compose*.yaml")

          if [ -z "$COMPOSE_FILES" ]; then
            echo "No Docker Compose files found!"
            exit 1
          fi

          echo "Found Docker Compose files:"
          echo "$COMPOSE_FILES"

          # Copy all files to VPS
          for file in $COMPOSE_FILES; do
            # Remove leading ./ from path
            file=${file#./}
            echo "Copying $file to VPS..."

            # Create directory structure on VPS
            DIR=$(dirname "$file")
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${VPS_USER}@${VPS_HOST} \
              "mkdir -p ${VPS_DEPLOY_PATH}/${DIR}"

            # Copy the compose file
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "$file" \
              ${VPS_USER}@${VPS_HOST}:${VPS_DEPLOY_PATH}/${file}
          done

          # Get unique service directories
          SERVICES=$(echo "$COMPOSE_FILES" | sed 's|^\./||' | xargs -n1 dirname | sort -u)

          # Deploy each service
          for service_dir in $SERVICES; do
            echo "Deploying service: $service_dir"

            # Find compose file in this directory
            COMPOSE_FILE=$(echo "$COMPOSE_FILES" | grep "/${service_dir}/\|^\./${service_dir}/" | head -n 1)
            COMPOSE_FILENAME=$(basename "$COMPOSE_FILE")

            # Deploy on VPS
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${VPS_USER}@${VPS_HOST} \
              "cd ${VPS_DEPLOY_PATH}/${service_dir} && \
              echo 'Pulling latest images for ${service_dir}...' && \
              docker compose -f ${COMPOSE_FILENAME} pull && \
              echo 'Deploying ${service_dir}...' && \
              docker compose -f ${COMPOSE_FILENAME} up -d --remove-orphans && \
              echo 'Service ${service_dir} deployed successfully!'"
          done

          echo "Cleaning up old Docker images..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${VPS_USER}@${VPS_HOST} \
            "docker image prune -f"

          echo "All services deployed successfully!"

      - name: Deployment Summary
        run: |
          COMPOSE_FILES=$(find . -type f -name "docker-compose*.yml" -o -name "docker-compose*.yaml" | sed 's|^\./||')
          SERVICES=$(echo "$COMPOSE_FILES" | xargs -n1 dirname | sort -u)
          
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All services deployed on every push to main**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed Services:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$SERVICES" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
