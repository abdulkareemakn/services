services:
  litestream:
    image: litestream/litestream:0.5.2
    container_name: litestream
    command: replicate
    volumes:
      - /opt/litestream/data:/data
      - /opt/memos:/opt/memos
      - /opt/opengist:/opt/opengist
      - ./litestream.yml:/etc/litestream.yml
    env_file: 
      - .env
    restart: unless-stopped
