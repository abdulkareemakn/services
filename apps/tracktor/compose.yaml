name: tracktor

services:
  tracktor:
    image: ghcr.io/javedh-dev/tracktor:latest
    container_name: tracktor
    restart: unless-stopped
    # Reachable only through Caddy at tracktor.localhost
    expose:
      - "3000"
    volumes:
      - /opt/tracktor/app:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true
    name: proxy