name: blinko
services:
  blinko-website:
    image: blinkospace/blinko:latest
    container_name: blinko-website
    environment:
      NODE_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: postgresql://postgres:a2402eb160268aed16cd2fbb014ef82c85b91a27@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
    - /opt/blinko/app:/app/.blinko
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://blinko-website:1111/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - proxy
    expose:
    - '1111'
    env_file:
    - .env
  postgres:
    image: postgres:14
    container_name: blinko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Karachi
    volumes:
    - /opt/blinko/db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - postgres
      - -d
      - postgres
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
    - proxy
    expose:
    - '5432'
    env_file:
    - .env
networks:
  proxy:
    external: true
    name: proxy
