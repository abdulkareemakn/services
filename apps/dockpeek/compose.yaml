name: dockpeek
services:
  dockpeek:
    image: ghcr.io/dockpeek/dockpeek:latest
    container_name: dockpeek
    environment:
    - SECRET_KEY=${SECRET_KEY}
    - USERNAME=${USERNAME}
    - PASSWORD=${PASSWORD}
    - DOCKER_HOST=tcp://socket-proxy:2375
    depends_on:
    - socket-proxy
    restart: unless-stopped
    expose:
    - '8000'
    networks:
    - proxy
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: dockpeek-socket-proxy
    environment:
    - CONTAINERS=1
    - IMAGES=1
    - PING=1
    - VERSION=1
    - INFO=1
    - POST=1
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
    - /run
    restart: unless-stopped
    expose:
    - '2375'
    networks:
    - proxy
networks:
  proxy:
    external: true
    name: proxy
