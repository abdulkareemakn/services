name: linkding

services:
  linkding:
    image: sissbruecker/linkding:1.44.1-alpine
    container_name: linkding
    restart: unless-stopped
    # Reachable only through Caddy at bookmarks.localhost
    expose:
      - "9090"
    volumes:
      - /opt/linkding/app:/etc/linkding/data
    env_file:
      - .env
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true
    name: proxy