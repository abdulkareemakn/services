name: portracker
services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: portracker-docker-proxy
    restart: unless-stopped
    environment:
    - CONTAINERS=1
    - IMAGES=1
    - INFO=1
    - NETWORKS=1
    - POST=0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
    - '2375'
    networks:
    - proxy
  portracker:
    image: mostafawahied/portracker:latest
    container_name: portracker
    restart: unless-stopped
    pid: host
    cap_add:
    - SYS_PTRACE
    - SYS_ADMIN
    security_opt:
    - apparmor:unconfined
    volumes:
    - /opt/portracker/ports:/data
    environment:
    - DOCKER_HOST=tcp://docker-proxy:2375
    depends_on:
    - docker-proxy
    expose:
    - '4999'
    networks:
    - proxy
networks:
  proxy:
    external: true
    name: proxy
