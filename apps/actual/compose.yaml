name: actual

services:
  actualbudget:
    image: ghcr.io/actualbudget/actual:sha-844cd34
    container_name: actualbudget
    restart: unless-stopped
    # Reachable only through Caddy at actual.localhost
    expose:
      - "5006"
    volumes:
      - /opt/actual/app:/data
    networks:
      - proxy
    environment:
      # ACTUAL_PORT: "5006"
      # ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB: "20"
      # ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB: "50"
      # ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB: "20"
      #
      # openid-only login assumes an upstream proxy performing authentication.
      # Caddy here does not, so switch to password auth before relying on this:
      #   ACTUAL_LOGIN_METHOD: password
      ACTUAL_LOGIN_METHOD: openid
      ACTUAL_ALLOWED_LOGIN_METHODS: openid
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

networks:
  proxy:
    external: true
    name: proxy