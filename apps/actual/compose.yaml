name: actual

services:
  actualbudget:
    image: ghcr.io/actualbudget/actual:sha-844cd34
    container_name: actualbudget
    restart: unless-stopped
    expose:
      - "5006"
    volumes:
      - /opt/actual/app:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

networks:
  proxy:
    external: true
    name: proxy
