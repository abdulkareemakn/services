name: sure

# Self-hosted Sure — https://github.com/we-promise/sure
#
# Every setting lives in .env next to this file; ${VAR:-default} fallbacks are
# used where a value is optional. See .env.example for the full list.
#
# Troubleshooting: some hosts resolve IPv6 first, which can make outbound calls
# to hosts like fc.yahoo.com hang. The explicit DNS servers below prefer IPv4.
# If problems persist, add an extra_hosts entry pinning the IPv4 address.

services:
  sure-app:
    image: ghcr.io/we-promise/sure:stable
    container_name: sure-app
    restart: unless-stopped
    # Reachable only through Caddy at sure.localhost
    expose:
      - "3000"
    volumes:
      - /opt/sure/app:/rails/storage
    networks:
      - proxy
    depends_on:
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sure_production}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      DB_HOST: sure-db
      DB_PORT: "5432"
      REDIS_URL: redis://sure-redis:6379/1
      # Enabling OpenAI incurs cost when using AI features (chat, rules).
      # Set spend limits on the account before enabling.
      OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_URI_BASE: ${OPENAI_URI_BASE:-}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
      OPENAI_REQUEST_TIMEOUT: ${OPENAI_REQUEST_TIMEOUT:-60}

  sure-worker:
    image: ghcr.io/we-promise/sure:stable
    container_name: sure-worker
    restart: unless-stopped
    command: bundle exec sidekiq
    volumes:
      - /opt/sure/app:/rails/storage
    networks:
      - proxy
    depends_on:
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sure_production}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      DB_HOST: sure-db
      DB_PORT: "5432"
      REDIS_URL: redis://sure-redis:6379/1
      OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_URI_BASE: ${OPENAI_URI_BASE:-}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
      OPENAI_REQUEST_TIMEOUT: ${OPENAI_REQUEST_TIMEOUT:-60}

  sure-db:
    image: postgres:16
    container_name: sure-db
    restart: unless-stopped
    # Internal only — never published to the host.
    expose:
      - "5432"
    volumes:
      - /opt/sure/db:/var/lib/postgresql/data
    networks:
      - proxy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sure_production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s

  sure-redis:
    image: redis:8-alpine
    container_name: sure-redis
    restart: unless-stopped
    # Internal only — never published to the host.
    expose:
      - "6379"
    volumes:
      - /opt/sure/redis:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
    name: proxy