name: forgejo
services:
  server:
    image: data.forgejo.org/forgejo/forgejo:12.0.1
    container_name: forgejo
    environment:
    - USER_UID=1000
    - USER_GID=1000
    restart: unless-stopped
    networks:
    - proxy
    volumes:
    - /opt/containers/forgejo:/data
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    expose:
    - '3000'
networks:
  proxy:
    external: true
    name: proxy
