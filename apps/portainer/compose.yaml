name: portainer
services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /opt/portainer/app:/data
    expose:
    - '8000'
    networks:
    - proxy
networks:
  proxy:
    external: true
    name: proxy
